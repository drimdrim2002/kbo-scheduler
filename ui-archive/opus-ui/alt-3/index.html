<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구단 매트릭스 — KBO 정규시즌 일정 편성 (opus-ui alt-3)</title>
<link rel="stylesheet" href="app/common/common.css">
<link rel="stylesheet" href="app/grid/grid.css">
</head>
<body>
<header class="g-top">
  <span class="g-title">구단 매트릭스<small>KBO 정규시즌 · 구단 × 슬롯</small></span>
  <div id="badge"></div>
  <div id="undo"></div>
</header>

<section class="g-sheet" aria-label="하단 시트">
  <div id="tabs" role="tablist"></div>
  <div id="sheet-body"></div>
</section>
<div id="popover" role="dialog" aria-label="머리 설정" hidden></div>
<script src="core/calendar-gen.js"></script>
<script src="core/preset-2025.js"></script>
<script src="core/score.js"></script>

<script src="core/store.js"></script>
<script src="core/engine-adapter.js"></script>
<script src="core/svg-chart.js"></script>
<script src="core/svg-map.js"></script>
<script src="app/common/dom.js"></script>
<script src="app/common/app.js"></script>
<script src="app/common/map-widget.js"></script>
<script src="app/common/panels-input.js"></script>
<script src="app/common/panels-result.js"></script>
<script src="app/common/panels-quality.js"></script>
<script src="app/common/panels-ops.js"></script>
<script src="app/grid/grid.js"></script>
