<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시즌 보드 — KBO 정규시즌 일정 편성 (opus-ui alt-2)</title>
<link rel="stylesheet" href="app/common/common.css">
<link rel="stylesheet" href="app/board/board.css">
</head>
<body>
<header class="bd-top">
  <div class="bd-logo"><i aria-hidden="true">⚾</i>시즌 보드 <small>KBO 정규시즌 일정 편성</small></div>
  <div id="badge"></div>
  <div id="quick"></div>
  <div id="undo"></div>
</header>
<nav class="bd-nav" id="drawer-nav" aria-label="입력·분석 패널"></nav>
<div id="tools"></div>
<div style="padding:0 18px" id="banner"></div>
<main class="bd-main">
  <section class="bd-boardwrap" aria-label="시즌 달력"><div id="board"></div></section>
  <aside class="bd-rail" aria-label="선택한 날과 위반">
    <div class="bd-card" id="rail-day"></div>
    <div class="bd-card"><h3 class="bd-railhead">위반 목록</h3><div id="rail-viol"></div></div>
    <div class="bd-card" id="rail-pool"></div>
  </aside>
</main>
<aside class="bd-drawer" id="drawer" hidden aria-labelledby="drawer-title">
  <div class="bd-drawer-head"><h2 id="drawer-title"></h2><button class="k-btn k-btn-ghost" id="drawer-wide" title="패널 넓게/좁게">⇔</button><button class="k-btn" id="drawer-close" aria-label="패널 닫기 (Esc)">✕ 닫기</button></div>
  <div id="drawer-body"></div>
</aside>
<script src="core/calendar-gen.js"></script>
<script src="core/preset-2025.js"></script>
<script src="core/score.js"></script>
<script src="core/reschedule.js"></script>
<script src="core/mock-solver.js"></script>
<script src="core/store.js"></script>
<script src="core/engine-adapter.js"></script>
<script src="core/svg-chart.js"></script>
<script src="core/svg-map.js"></script>
<script src="app/common/dom.js"></script>
<script src="app/common/app.js"></script>
<script src="app/common/map-widget.js"></script>
<script src="app/common/panels-input.js"></script>
<script src="app/common/panels-result.js"></script>
<script src="app/common/panels-quality.js"></script>
<script src="app/common/panels-ops.js"></script>
<script src="app/board/board.js"></script>
</body>
</html>
