<html lang="ko">
<head>
<meta charset="utf-8">

<title>KBO 편성 레이아웃 2차</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #f1efea; }
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 372px 1fr; grid-template-rows: 58px 1fr; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; font-size: 12px; color: var(--ink-3); }
  header .sp { flex: 1; }
  .seg { display: inline-flex; background: #ebe8e2; border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  /* 왼쪽 목록 */
  .list { padding: 12px; display: flex; flex-direction: column; gap: 7px; border-right: 1px solid var(--line); overflow: auto; }
  .item { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; padding: 6px; border-radius: 12px; border: 1px solid transparent; background: transparent; text-align: left; }
  .item img { width: 112px; height: 70px; object-fit: cover; object-position: top left; border-radius: 7px; border: 1px solid var(--line); background: #fff; }
  .item b { display: block; font-size: 13px; }
  .item span { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; display: block; }
  .item:hover { background: #fff; }
  .item[aria-selected="true"] { background: #fff; border-color: var(--ink); }
  .item .no { font: 700 10px var(--mono); color: var(--accent); }
  .item.rec .no::after { content: " · 추천"; color: var(--ok); }
  /* 오른쪽 상세 */
  .detail { display: grid; grid-template-columns: 1fr 340px; gap: 18px; padding: 16px 20px; min-height: 0; }
  .shot { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .shot img { width: 100%; border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); background: #fff; }
  .shot h2 { margin: 0; font-size: 22px; letter-spacing: -0.4px; }
  .shot .one { font-size: 13.5px; color: var(--ink-2); margin: 0; }
  .shot .open { display: flex; gap: 8px; align-items: center; }
  .facts { font-size: 12.5px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
  .facts h4 { margin: 0 0 4px; font-size: 11px; color: var(--ink-3); letter-spacing: 0.4px; }
  .facts ul { margin: 0; padding-left: 16px; }
  .facts li { margin: 2px 0; }
  .phase { display: grid; grid-template-columns: 22px 1fr; gap: 4px 6px; }
  .phase b { font: 700 11px var(--mono); color: #fff; border-radius: 4px; text-align: center; height: 18px; line-height: 18px; }
  .p1 { background: #6b6f7b; } .p2 { background: #c9302c; } .p3 { background: #b7791f; } .p4 { background: #2f5bea; }
  .fit { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
  /* 비교표 */
  .compare { grid-column: 1 / 3; padding: 16px 20px; overflow: auto; display: none; }
  .compare.show { display: block; }
  table.cmp { border-collapse: collapse; width: 100%; background: #fff; border-radius: 12px; overflow: hidden; font-size: 12.5px; }
  table.cmp th, table.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp thead th { background: #faf9f6; font-size: 11.5px; color: var(--ink-2); }
  table.cmp td.s3 { color: var(--ok); font-weight: 700; }
  table.cmp td.s1 { color: var(--ink-3); }
  .rec-box { margin-top: 14px; background: #fff; border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.6; border-left: 4px solid var(--ok); }
  .rec-box h3 { margin: 0 0 6px; font-size: 15px; }
</style>
</head>

  </header>
  <nav class="list" id="list" aria-label="시안 목록"></nav>
  <main class="detail" id="detail"></main>
  <section class="compare" id="compare"></section>

      one: "12×8 격자 위에 위젯 12종을 자유롭게 배치하는 작업대입니다. 단계별 프리셋으로 시작하고, 구단을 누르면 모든 위젯이 함께 걸러집니다.",
      act: ["위젯 머리 끌기(격자 스냅, 겹치면 자리 교환)", "모서리로 크기 조절, 추가·닫기", "슬롯 보드에서 슬롯 머리를 끌어 교환(Δ 미리보기)", "구단 교차 필터"],
      ph: ["입력 보드: 시즌 골격, 구단·구장·거리(필터 구단 기준 수정), 이벤트", "검토 보드: Hard 상태, 점수, 슬롯 보드, 솔버", "보정 보드: 슬롯 보드, 우천 취소·재편성", "보고 보드: 이동거리, 지도, 상대 매트릭스, 홈/원정"],
      pro: ["역할마다 자기 작업대를 꾸릴 수 있음", "엑셀·BI 사용자에게 익숙한 대시보드 문법", "기능 확장이 위젯 추가로 끝남"],
      con: ["정보 밀도가 위젯 크기에 좌우됨", "배치 관리가 또 하나의 일", "일곱 안 중 가장 익숙한 형태 — 새로움은 적음"],
      fit: "여러 역할이 한 도구를 같이 쓸 때, 화면을 직접 꾸미고 싶은 파워 유저." },
  ];
  let cur = 0;
  const list = document.getElementById("list");
  list.innerHTML = D.map((d, i) => `<button class="item${d.rec ? " rec" : ""}" data-i="${i}" role="tab" aria-selected="${i === cur}"><img src="thumbs/0${i + 1}.png" alt=""><span><span class="no">0${i + 1} · ${d.k}</span><b>${d.t}</b><span>${d.one.split(". ")[0]}.</span></span></button>`).join("");
  function show(i) {
    cur = i;
    [...list.children].forEach((el, k) => el.setAttribute("aria-selected", String(k === i)));
    const d = D[i];
    document.getElementById("detail").innerHTML = `<div class="shot"><div class="open"><h2>0${i + 1} ${d.t}</h2><span class="tag">${d.k}</span>${d.rec ? '<span class="tag" style="background:var(--ok-soft);color:var(--ok)">추천</span>' : ""}<span style="flex:1"></span><a class="btn primary" href="${d.f}">시안 열기 →</a></div><p class="one">${d.one}</p><a href="${d.f}"><img src="thumbs/0${i + 1}.png" alt="${d.t} 화면"></a></div>
      <div class="facts"><div><h4>네 단계가 있는 곳</h4><div class="phase">${d.ph.map((p, k) => `<b class="p${k + 1}">${k + 1}</b><span>${p}</span>`).join("")}</div></div>
      <div><h4>움직이는 상호작용</h4><ul>${d.act.map((a) => `<li>${a}</li>`).join("")}</ul></div>
      <div><h4>강점</h4><ul>${d.pro.map((a) => `<li>${a}</li>`).join("")}</ul></div>
      <div><h4>약점</h4><ul>${d.con.map((a) => `<li>${a}</li>`).join("")}</ul></div>
      <div class="fit"><h4>적합한 사용자</h4>${d.fit}</div></div>`;
  }
  list.addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) { show(+b.dataset.i); setView("detail"); } });
  const C = [
    ["시즌 전체 조망", 3, 1, 2, 1, 1, 2, 2],
    ["세부 보정의 정밀도", 3, 2, 2, 2, 3, 2, 3],
    ["입력의 편의", 2, 3, 2, 3, 2, 1, 3],
    ["원인 → 결과 가시성", 3, 2, 2, 3, 2, 2, 2],
    ["여러 안 비교·의사결정", 1, 2, 3, 2, 1, 1, 2],
    ["시즌 중 운영(우천·재편성)", 2, 2, 2, 2, 2, 3, 2],
    ["엑셀 사용자의 학습 부담 (높을수록 쉬움)", 2, 1, 2, 1, 3, 3, 3],
    ["구현 난이도 (높을수록 쉬움)", 1, 3, 2, 1, 2, 2, 2],
  ];
  const mark = (v) => ["", "○", "◐", "●"][v];
  document.getElementById("compare").innerHTML = `<table class="cmp"><thead><tr><th>기준</th>${D.map((d, i) => `<th>0${i + 1}<br>${d.t}</th>`).join("")}</tr></thead><tbody>${C.map(([n, ...v]) => `<tr><td>${n}</td>${v.map((x) => `<td class="s${x}">${mark(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="rec-box"><h3>추천: 01 시즌 아틀라스를 주 작업면으로, 03 분기 비교와 02 명령 팔레트를 그 위에 얹는 조합</h3>
    주 사용자는 시즌 전체를 머리에 두고 일정을 고치는 사무국 편성 담당자입니다. 아틀라스는 입력(골격)과 결과(일정)를 같은 달력 위에 두고, 줌으로 밀도를 바꿔 화면 전환 없이 네 단계를 모두 처리합니다. 1차 시안의 핵심 문제였던 ‘원인과 결과가 다른 자리에 있다’를 가장 직접적으로 풉니다.<br>
    아틀라스가 약한 두 가지는 다른 시안의 장점으로 메웁니다. <b>여러 안 비교(SC-3)</b>는 03의 분기 나무와 스와이프 diff를 ‘비교 모드’로 붙이고, <b>반복 작업의 속도</b>는 02의 ⌘K 팔레트(드라이런 Δ, 수정 제안)를 캔버스 위 단축 입력으로 넣습니다. 05 구단 여정은 구단 운영팀 배포용 읽기 전용 화면으로, 06 리플레이는 보고용 재생 모드로 후속 검토를 권합니다.<br>
    <span class="faint">● 강함 · ◐ 보통 · ○ 약함. 자세한 근거는 README.md.</span></div>`;
  function setView(v) {
    document.querySelectorAll("#view button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
    document.getElementById("detail").style.display = v === "detail" ? "" : "none";
    document.getElementById("list").style.display = v === "detail" ? "" : "none";
    document.getElementById("compare").classList.toggle("show", v === "compare");
  }
  document.querySelectorAll("#view button").forEach((b) => b.onclick = () => setView(b.dataset.v));
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") show(Math.min(D.length - 1, cur + 1)); if (e.key === "ArrowUp") show(Math.max(0, cur - 1)); });
  show(0);
})();
</script>
</body>
</html>
