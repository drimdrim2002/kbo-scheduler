<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편성 커맨드</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: #15171c; color: #e9e9ec; }
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 76px 1fr; grid-template-rows: 112px 1fr 52px; }
  /* 단계 레일: 카드를 단계별로 거른다 */
  .rail { grid-row: 1 / 4; background: #0f1115; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 10px; border-right: 1px solid #23262d; }
  .rail .logo { font-weight: 800; font-size: 13px; color: #fff; margin-bottom: 10px; text-align: center; line-height: 1.1; }
  .rail button { width: 58px; height: 64px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: #8d929c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; }
  .rail button b { font-size: 17px; color: #d6d8de; }
  .rail button .n { font: 600 10px var(--mono); padding: 0 5px; border-radius: 99px; background: #2a2e37; color: #c5c8d0; }
  .rail button .n.bad { background: #5a1f1d; color: #ffb1ac; }
  .rail button[aria-pressed="true"] { background: #232731; border-color: #3a4050; color: #fff; }
  /* 명령 줄 */
  .top { display: flex; align-items: center; gap: 18px; padding: 0 22px; position: relative; }
  .cmdwrap { flex: 1; position: relative; }
  .cmd { display: flex; align-items: center; gap: 10px; background: #fff; color: #15171c; border-radius: 14px; padding: 0 14px; height: 52px; box-shadow: 0 0 0 4px rgba(90, 130, 255, 0.25); }
  .cmd .k { font: 600 11px var(--mono); color: #888; border: 1px solid #ddd; border-radius: 5px; padding: 2px 5px; }
  .cmd input { flex: 1; border: 0; outline: none; font-size: 17px; background: transparent; }
  .cmd .pv { font: 12px var(--mono); color: #555; white-space: nowrap; }
  .cmd .pv .bad { color: var(--bad); }
  .cmd .pv .good { color: var(--ok); }
  .sugg { display: flex; gap: 6px; margin-top: 8px; overflow: hidden; height: 26px; }
  .sugg button { border: 1px solid #343a46; background: #1d2027; color: #c9ccd4; border-radius: 99px; padding: 3px 11px; font-size: 12px; white-space: nowrap; }
  .sugg button:hover { border-color: #6d8cff; color: #fff; }
  .sugg .lead { color: #6f7480; font-size: 11px; align-self: center; white-space: nowrap; }
  .ac { position: absolute; left: 0; right: 0; top: 58px; background: #fff; color: #15171c; border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); z-index: 20; padding: 6px; display: none; max-height: 380px; overflow: auto; }
  .ac.show { display: block; }
  .ac .it { display: grid; grid-template-columns: 26px 230px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .ac .it .ph { font-size: 10px; color: #fff; background: #555; border-radius: 4px; text-align: center; padding: 1px 0; }
  .ac .it code { font: 12.5px var(--mono); }
  .ac .it code i { color: #999; font-style: normal; }
  .ac .it .d { color: #777; font-size: 12px; }
  .ac .it[aria-selected="true"] { background: #eef2ff; }
  .status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .status .sc { font: 11px var(--mono); color: #9aa0ab; }
  /* 카드 보드: 최신 카드가 2×2 무대를 차지하고 이전 카드는 1×1 자리로 밀려난다 */
  .board { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 14px; padding: 6px 22px 10px; min-height: 0; }
  .card { background: #fbfaf8; color: #1d1d1f; border-radius: 14px; padding: 14px 16px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; animation: pop 0.28s ease; }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } }
  .card.focus { grid-column: 1 / 3; grid-row: 1 / 3; box-shadow: 0 0 0 2px #6d8cff; }
  .card.small { cursor: pointer; }
  .card.small:hover { box-shadow: 0 0 0 2px #59607a; }
  .card .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card .hd .ph { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; }
  .ph0 { background: #3d4250; } .ph1 { background: #6b6f7b; } .ph2 { background: #c9302c; } .ph3 { background: #b7791f; } .ph4 { background: #2f5bea; }
  .card .hd h3 { margin: 0; font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .hd .q { font: 11px var(--mono); color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .card .hd .x { border: 0; background: transparent; color: #999; font-size: 14px; padding: 0 2px; }
  .card .bd { flex: 1; min-height: 0; overflow: hidden; font-size: 12.5px; }
  .card.focus .bd { overflow: auto; }
  .card .ft { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .big { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .vrow { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .vrow .rule { justify-self: start; }
  .fixes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .fixes button { border: 1px solid #c7d3fb; background: #f0f4ff; border-radius: 7px; padding: 3px 8px; font-size: 11.5px; }
  .fixes button:hover { background: var(--accent); color: #fff; }
  .strip { display: flex; gap: 2px; flex-wrap: nowrap; }
  .strip span { width: 9px; height: 16px; border-radius: 2px; background: var(--away); flex: none; }
  .strip span.H { background: var(--home); }
  .strip span.over { box-shadow: 0 0 0 2px var(--bad); }
  .hist { grid-column: 2; display: flex; align-items: center; gap: 8px; padding: 0 22px 0 60px; border-top: 1px solid #23262d; overflow: hidden; }
  .hist .lead { color: #6f7480; font-size: 11px; white-space: nowrap; }
  .hist button { border: 0; background: #1d2027; color: #b9bdc7; border-radius: 7px; padding: 5px 9px; font: 11.5px var(--mono); white-space: nowrap; }
  .hist button:hover { color: #fff; background: #2a2f3a; }
  .empty { color: #7a7f8a; border: 1px dashed #343a46; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; padding: 10px; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.mini td, table.mini th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  table.mini th { color: var(--ink-3); font-weight: 600; font-size: 11px; }
  .monthgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .monthgrid .m b { font-size: 12px; }
  .monthgrid .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 4px; }
  .monthgrid .days i { height: 9px; border-radius: 2px; background: #dfe6fb; }
  .monthgrid .days i.rest { background: #ece7de; }
  .monthgrid .days i.black { background: #3a3835; }
  .monthgrid .days i.hol { background: #f19a95; }
  .monthgrid .days i.pad { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="단계 필터">
    <div class="logo">KBO<br>편성<br>커맨드</div>
    <button data-ph="0" aria-pressed="true"><b>∗</b>전체</button>
    <button data-ph="1" aria-pressed="false"><b>①</b>입력<span class="n" id="n1">0</span></button>
    <button data-ph="2" aria-pressed="false"><b>②</b>결과<span class="n" id="n2">0</span></button>
    <button data-ph="3" aria-pressed="false"><b>③</b>보정<span class="n" id="n3">0</span></button>
    <button data-ph="4" aria-pressed="false"><b>④</b>분석<span class="n" id="n4">0</span></button>
  </nav>
  <header class="top">
    <div class="cmdwrap">
      <label class="cmd"><span style="font-size:18px">›</span><input id="q" autocomplete="off" spellcheck="false" placeholder="무엇을 할까요?  예) 한화 연속 원정 고쳐줘 · 교환 5/13 5/16 · 실행 · 우천 6/10 KIA 삼성" aria-label="명령 입력"><span class="pv" id="pv"></span><span class="k">⌘K</span></label>
      <div class="ac" id="ac" role="listbox"></div>
      <div class="sugg" id="sugg"></div>
    </div>
    <div class="status"><span id="badge"></span><span class="sc" id="sc"></span></div>
  </header>
  <main class="board" id="board"></main>
  <footer class="hist" id="hist"></footer>
</div>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
(() => {
  const { K, $, $$, esc, T, color, park, chip, store, fmt, sign, slotDays } = KB;
  let cards = [], focusId = null, phase = 0, seq = 0, history = [], skel = KB.defaultSkeleton(), cancelled = [];
  const PH = ["", "입력", "결과", "보정", "분석"];

  // ── 명령 문법: 키워드 + 구단명 + 날짜(m/d) + 숫자 ──
  const syn = (s, words) => words.some((w) => s.includes(w));
  const teamsIn = (s) => T.filter((t) => new RegExp(t, "i").test(s)).sort((a, b) => s.toLowerCase().indexOf(a.toLowerCase()) - s.toLowerCase().indexOf(b.toLowerCase()));
  const datesIn = (s) => [...s.matchAll(/(\d{1,2})\/(\d{1,2})/g)].map((m) => `2025-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`);
  const slotOfDate = (d) => KB.dayToSlot[d];
  const COMMANDS = [
    { ph: 1, t: "시즌 <개막 m/d>~<종료 m/d> 휴식 <요일>", d: "시즌 골격과 슬롯 수", ex: "시즌 3/22~8/31 휴식 월" },
    { ph: 1, t: "구단", d: "구단·구장 목록과 연고 구장", ex: "구단" },
    { ph: 1, t: "거리 <구단> <구단> [km]", d: "구장 간 거리 조회·수정", ex: "거리 KIA 롯데" },
    { ph: 1, t: "고정 <원정>@<홈> <m/d>", d: "대진 지정 이벤트를 핀으로", ex: "고정 LG@두산 8/15" },
    { ph: 1, t: "이벤트", d: "개막전·어린이날·사용자 정의", ex: "이벤트" },
    { ph: 2, t: "실행 [초]", d: "솔버 실행, 점수 추이 실시간", ex: "실행" },
    { ph: 2, t: "위반", d: "Hard 위반과 자동 수정 제안", ex: "위반" },
    { ph: 2, t: "점수", d: "Soft 단계별 분해(S0~S4)", ex: "점수" },
    { ph: 3, t: "<구단> 연속 원정 고쳐줘", d: "제안을 계산해 카드로", ex: "한화 연속 원정 고쳐줘" },
    { ph: 3, t: "교환 <m/d> <m/d>", d: "두 슬롯 통째 교환", ex: "교환 5/13 5/16" },
    { ph: 3, t: "뒤집기 <구단> <구단> <m/d>", d: "시리즈 홈·원정 뒤집기", ex: "뒤집기 한화 롯데 5/27" },
    { ph: 3, t: "우천 <m/d> <구단> <구단>", d: "1경기 취소 기록", ex: "우천 6/10 KIA 삼성" },
    { ph: 3, t: "재편성 [월요일] [DH]", d: "취소 경기를 9~10월로", ex: "재편성 월요일" },
    { ph: 3, t: "되돌리기", d: "마지막 수정 취소", ex: "되돌리기" },
    { ph: 4, t: "<구단> 일정", d: "한 구단의 시즌 흐름과 동선", ex: "KIA 일정" },
    { ph: 4, t: "이동거리", d: "구단별 이동거리 막대·허용오차", ex: "이동거리" },
    { ph: 4, t: "지도 <구단>", d: "구단 이동 경로 지도", ex: "지도 롯데" },
    { ph: 4, t: "홈원정", d: "10개 구단 홈/원정 흐름", ex: "홈원정" },
  ];

  function parse(raw) {
    const s = raw.trim();
    if (!s) return null;
    const tm = teamsIn(s), ds = datesIn(s), num = (s.match(/\s(\d{2,4})(?:\s*km)?\s*$/) || [])[1];
    if (syn(s, ["되돌", "취소해", "undo"])) return { k: "undo" };
    if (syn(s, ["시즌", "골격", "휴식"])) return { k: "skel", ds, rest: (s.match(/휴식\s*([일월화수목금토])/) || [])[1] };
    if (syn(s, ["거리"]) && tm.length >= 2 && !syn(s, ["이동거리"])) return { k: "dist", a: tm[0], b: tm[1], v: num && +num };
    if (syn(s, ["고정", "핀"]) && tm.length >= 2 && ds.length) return { k: "pin", a: tm[0], b: tm[1], d: ds[0] };
    if (syn(s, ["이벤트"])) return { k: "events" };
    if (syn(s, ["구단", "구장"]) && !tm.length) return { k: "teams" };
    if (syn(s, ["실행", "돌려", "최적화", "run"])) return { k: "run" };
    if (syn(s, ["고쳐", "수정 제안", "해결"]) && tm.length) return { k: "fixteam", t: tm[0] };
    if (syn(s, ["위반", "문제"])) return { k: "viol" };
    if (syn(s, ["점수", "score"])) return { k: "score" };
    if (syn(s, ["교환", "바꿔", "swap"]) && ds.length >= 2) return { k: "swap", a: slotOfDate(ds[0]), b: slotOfDate(ds[1]), ds };
    if (syn(s, ["뒤집", "flip"]) && tm.length >= 2 && ds.length) return { k: "flip", a: tm[0], b: tm[1], d: ds[0] };
    if (syn(s, ["우천", "폭염", "취소"]) && tm.length >= 2 && ds.length) return { k: "rain", a: tm[0], b: tm[1], d: ds[0] };
    if (syn(s, ["재편성"])) return { k: "rebook", monday: syn(s, ["월요일"]), dh: syn(s, ["DH", "dh", "더블"]) };
    if (syn(s, ["이동거리", "비교"])) return { k: "km" };
    if (syn(s, ["홈원정", "홈/원정", "흐름"])) return { k: "ha" };
    if (syn(s, ["지도", "동선", "경로"]) && tm.length) return { k: "map", t: tm[0] };
    if (tm.length === 1) return { k: "team", t: tm[0] };
    return { k: "?" };
  }
  const findSeries = (a, b, d) => {
    const i = slotOfDate(d);
    if (i == null) return null;
    return store.inSlot(i).find((s) => (s.home === a && s.away === b) || (s.home === b && s.away === a));
  };

  // Enter 전에 결과를 미리 계산해 명령 줄 오른쪽에 Δ로 보여준다(드라이런).
  function dry(c) {
    if (!c) return "";
    const fmtD = (pv) => `Hard <span class="${pv.dHard > 0 ? "bad" : pv.dHard < 0 ? "good" : ""}">${sign(pv.dHard)}</span> · 리그 ${sign(pv.dKm, "km")}`;
    if (c.k === "swap") return c.a == null || c.b == null ? '<span class="bad">경기 없는 날짜</span>' : fmtD(KB.preview({ op: "swap", a: c.a, b: c.b }));
    if (c.k === "flip") { const s = findSeries(c.a, c.b, c.d); return s ? fmtD(KB.preview({ op: "flip", id: s.id })) : '<span class="bad">그날 그 대진이 없습니다</span>'; }
    if (c.k === "pin") { const s = findSeries(c.a, c.b, c.d); return s ? `${s.away}@${s.home} 고정` : '<span class="bad">그날 그 대진이 없습니다</span>'; }
    if (c.k === "rain") { const s = findSeries(c.a, c.b, c.d); return s ? `${s.away}@${s.home} 1경기 → 재편성 대기` : '<span class="bad">그날 그 대진이 없습니다</span>'; }
    if (c.k === "dist") return `현재 ${KB.dist(c.a, c.b).toFixed(1)}km${c.v ? ` → ${c.v}km` : ""}`;
    if (c.k === "?") return '<span class="bad">알 수 없는 명령 · 도움말은 ⌘K</span>';
    return "Enter ↵";
  }

  // ── 카드 ──
  function add(kind, ph, title, q, data = {}) {
    const c = { id: ++seq, kind, ph, title, q, data };
    cards.unshift(c);
    focusId = c.id;
    if (phase && phase !== ph) setPhase(0);
    render();
    return c;
  }
  function exec(raw, silent) {
    const c = parse(raw);
    if (!c) return;
    if (!silent) history.unshift(raw);
    const q = raw.trim();
    switch (c.k) {
      case "skel": {
        if (c.ds[0]) skel.opening = c.ds[0];
        if (c.ds[1]) skel.end = c.ds[1];
        if (c.rest) skel.restDays = ["일월화수목금토".indexOf(c.rest)];
        add("skel", 1, "시즌 골격", q, { s: JSON.parse(JSON.stringify(skel)) }); break;
      }
      case "teams": add("teams", 1, "구단·구장 10", q); break;
      case "events": add("events", 1, "이벤트·고정 경기", q); break;
      case "dist": {
        if (c.v) { const i = KB.idx[c.a], j = KB.idx[c.b]; K.dist[i][j] = K.dist[j][i] = c.v; store.emit({ op: "dist" }); }
        add("dist", 1, `거리 ${c.a}–${c.b}`, q, { a: c.a, b: c.b }); break;
      }
      case "pin": {
        const s = findSeries(c.a, c.b, c.d);
        if (!s) return KB.toast("그날 그 대진이 없습니다");
        if (!s.pin) store.apply({ op: "pin", id: s.id });
        add("pin", 1, `고정 ${s.away}@${s.home}`, q, { id: s.id }); break;
      }
      case "run": {
        const card = add("run", 2, "솔버 실행", q, { pts: [{ h: store.ev.hardSum, k: store.ev.soft.S4 }], done: false, steps: 0 });
        KB.solve({ interval: 260, onTick: (e, n) => { card.data.pts.push({ h: e.hardSum, k: e.soft.S4 }); card.data.steps = n; }, onDone: (e, n) => { card.data.done = true; card.data.steps = n; render(); } });
        break;
      }
      case "viol": add("viol", 2, "Hard 위반", q); break;
      case "score": add("score", 2, "점수 분해", q); break;
      case "fixteam": add("fixteam", 3, `${c.t} 수정 제안`, q, { t: c.t }); break;
      case "swap": {
        if (c.a == null || c.b == null) return KB.toast("경기 없는 날짜입니다");
        const before = store.ev;
        store.apply({ op: "swap", a: c.a, b: c.b });
        add("delta", 3, `교환 ${K.slots[c.a].label} ↔ ${K.slots[c.b].label}`, q, { before }); break;
      }
      case "flip": {
        const s = findSeries(c.a, c.b, c.d);
        if (!s) return KB.toast("그날 그 대진이 없습니다");
        const before = store.ev;
        store.apply({ op: "flip", id: s.id });
        add("delta", 3, `뒤집기 → ${s.away}@${s.home}`, q, { before }); break;
      }
      case "rain": {
        const s = findSeries(c.a, c.b, c.d);
        if (!s) return KB.toast("그날 그 대진이 없습니다");
        cancelled.push({ home: s.home, away: s.away, date: c.d });
        add("rain", 3, `우천 취소 ${s.away}@${s.home}`, q, { home: s.home, away: s.away, d: c.d }); break;
      }
      case "rebook": add("rebook", 3, "9~10월 재편성 (목업)", q, { r: KB.rebook(cancelled, c), opt: c }); break;
      case "undo": store.undo(); KB.toast("마지막 수정을 되돌렸습니다"); break;
      case "km": add("km", 4, "구단별 이동거리", q); break;
      case "ha": add("ha", 4, "홈/원정 흐름", q); break;
      case "map": add("map", 4, `${c.t} 시즌 동선`, q, { t: c.t }); break;
      case "team": add("team", 4, `${c.t} 시즌`, q, { t: c.t }); break;
      default: KB.toast("알아듣지 못했습니다. ⌘K로 명령 목록을 여세요");
    }
    renderHist();
  }

  // 위반 하나에 대해 주변 뒤집기·교환 후보를 실제로 채점해 좋은 순으로 2개를 고른다.
  function suggest(v) {
    const cands = [];
    const near = (i) => Math.abs(i - v.slot) <= 4;
    store.plan.filter((s) => near(s.slot) && (!v.team || s.home === v.team || s.away === v.team) && !s.pin).forEach((s) => cands.push({ op: "flip", id: s.id, label: `뒤집기 ${s.away}@${s.home} ${K.slots[s.slot].label.split("(")[0]}`, cmd: `뒤집기 ${s.home} ${s.away} ${K.slots[s.slot].label.split("(")[0]}` }));
    K.slots.forEach((sl, j) => { if (j !== v.slot && Math.abs(j - v.slot) <= 6 && sl.len === K.slots[v.slot].len && !store.inSlot(j).some((s) => s.pin)) cands.push({ op: "swap", a: v.slot, b: j, label: `교환 ${K.slots[v.slot].label.split("(")[0]}↔${sl.label.split("(")[0]}`, cmd: `교환 ${K.slots[v.slot].label.split("(")[0]} ${sl.label.split("(")[0]}` }); });
    return cands.map((c) => ({ ...c, pv: KB.preview(c) })).filter((c) => c.pv.dHard < 0).sort((a, b) => a.pv.dHard - b.pv.dHard || a.pv.dKm - b.pv.dKm).slice(0, 2);
  }
  const fixBtns = (v) => suggest(v).map((f) => `<button data-run="${esc(f.cmd)}">${esc(f.label)} <span class="faint">H${sign(f.pv.dHard)} · ${sign(f.pv.dKm, "km")}</span></button>`).join("") || '<span class="faint">주변에서 바로 줄이는 수가 없습니다</span>';

  function body(c, big) {
    const ev = store.ev;
    switch (c.kind) {
      case "help": return `<div style="font-size:${big ? 15 : 12}px;margin-bottom:10px">입력·확인·보정·분석을 모두 <b>명령 한 줄</b>로 합니다. 결과는 카드로 쌓이고, 가장 최근 카드가 큰 무대를 차지합니다. 작은 카드를 누르면 다시 무대로 올라옵니다.</div>
        ${big ? `<table class="mini"><tr><th>단계</th><th>명령 예</th><th>하는 일</th></tr>${COMMANDS.map((m) => `<tr><td><span class="ph ph${m.ph}" style="font-size:10px;color:#fff;padding:1px 5px;border-radius:4px">${PH[m.ph]}</span></td><td><a href="#" data-run="${esc(m.ex)}" class="mono">${esc(m.ex)}</a></td><td class="faint">${m.d}</td></tr>`).join("")}</table>` : ""}`;
      case "skel": {
        const gen = KB.generateSlots(c.data.s);
        const months = [3, 4, 5, 6, 7, 8];
        const inB = (s) => c.data.s.blackouts.some((b) => s >= b.from && s <= b.to);
        const grid = months.map((m) => {
          const first = new Date(2025, m - 1, 1), n = new Date(2025, m, 0).getDate();
          let cells = "<i class='pad'></i>".repeat((first.getDay() + 6) % 7);
          for (let d = 1; d <= n; d++) {
            const s = `2025-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`, w = new Date(2025, m - 1, d).getDay();
            const cls = s < c.data.s.opening || s > c.data.s.end ? "pad" : inB(s) ? "black" : c.data.s.holidays.includes(s) ? "hol" : c.data.s.restDays.includes(w) && !c.data.s.exceptions.includes(s) ? "rest" : "";
            cells += `<i class="${cls}" title="${s}"></i>`;
          }
          return `<div class="m"><b>${m}월</b><div class="days">${cells}</div></div>`;
        }).join("");
        return `<div style="display:flex;gap:24px;align-items:baseline"><div><div class="big">${gen.length}</div><div class="faint">슬롯</div></div><div><div class="big">${gen.filter((g) => g.len === 3).length}</div><div class="faint">3연전</div></div><div class="faint">${c.data.s.opening.slice(5)} 개막 · ${c.data.s.end.slice(5)} 1차 종료 · 휴식 ${c.data.s.restDays.map((k) => "일월화수목금토"[k]).join("")}</div></div>
          ${big ? `<div class="monthgrid" style="margin-top:14px">${grid}</div><p class="faint" style="font-size:11px">■ 경기일 · 베이지 휴식 · 검정 블랙아웃(${c.data.s.blackouts.map((b) => b.name).join(", ")}) · 빨강 공휴일</p>` : ""}`;
      }
      case "teams": return `<table class="mini"><tr><th>구단</th><th>구장</th>${big ? "<th>위경도</th>" : ""}</tr>${K.teams.slice(0, big ? 10 : 5).map((t) => `<tr><td>${chip(t.name)}</td><td>${t.stadium}</td>${big ? `<td class="num faint">${t.lat.toFixed(3)}, ${t.lng.toFixed(3)}</td>` : ""}</tr>`).join("")}</table>${big ? "" : '<div class="faint">… 10개 구단</div>'}`;
      case "events": return K.events.map((e) => `<div class="kv"><span>${esc(e.name || e.type)} <span class="tag">${e.mode}</span></span><span class="num">${e.date.slice(5)}</span></div>${big ? `<div class="faint" style="font-size:11px;padding:2px 0 6px">${e.items.join(" · ")}</div>` : ""}`).join("");
      case "dist": { const d = KB.dist(c.data.a, c.data.b); return `<div class="big">${d.toFixed(1)}<span style="font-size:14px"> km</span></div><div>${chip(c.data.a)} ${park(c.data.a)} ↔ ${chip(c.data.b)} ${park(c.data.b)}</div>${big ? `<p class="faint">고치려면 <code>거리 ${c.data.a} ${c.data.b} 260</code>처럼 숫자를 붙입니다. 대칭 값도 함께 바뀌고 즉시 재채점됩니다.</p>` : ""}`; }
      case "pin": { const s = store.get(c.data.id); return `<div class="big">📌 ${esc(s.away)}@${esc(s.home)}</div><div class="faint">${K.slots[s.slot].label} · ${park(s.home)} · 솔버가 옮기지 않습니다</div>`; }
      case "run": {
        const pts = c.data.pts, w = big ? 520 : 230, h = big ? 140 : 60;
        const mn = Math.min(...pts.map((p) => p.k)), mx = Math.max(...pts.map((p) => p.k));
        const line = pts.map((p, k) => `${(k / Math.max(1, pts.length - 1)) * w},${6 + (1 - (p.k - mn) / Math.max(1, mx - mn)) * (h - 12)}`).join(" ");
        const last = pts[pts.length - 1];
        return `<div style="display:flex;gap:20px;align-items:baseline"><div><div class="big" style="color:${last.h ? "var(--bad)" : "var(--ok)"}">${last.h}</div><div class="faint">Hard</div></div><div><div class="big">${fmt(last.k)}</div><div class="faint">리그 km</div></div><div class="faint">${c.data.done ? `종료 · 개선 ${c.data.steps}회` : `탐색 중… 개선 ${c.data.steps}회`}</div></div>
          <svg width="${w}" height="${h}" style="margin-top:8px;background:#f1f0ec;border-radius:8px"><polyline points="${line}" fill="none" stroke="#2f5bea" stroke-width="2"/></svg>
          ${big ? '<p class="faint" style="font-size:11px">목업 솔버는 고정되지 않은 시리즈를 엔진 해(input_2025) 쪽으로 한 수씩 되돌리며 점수를 개선합니다.</p>' : ""}`;
      }
      case "viol": return ev.hard.length ? ev.hard.slice(0, big ? 8 : 3).map((v) => `<div class="vrow"><span class="rule">${v.rule}</span><div>${esc(v.detail)}${big ? `<div class="fixes">${fixBtns(v)}</div>` : ""}</div></div>`).join("") + (big ? '<p class="faint" style="font-size:11px">첫 화면 위반 3건은 결과 확인 단계를 보이려고 엔진 해에 얹은 가상 변형입니다. 제안 버튼은 주변 뒤집기·교환을 실제로 채점해 Hard가 줄어드는 수만 보여 줍니다.</p>' : "") : '<div class="big" style="color:var(--ok)">✓ 위반 없음</div>';
      case "score": return `<div class="kv"><span>Hard</span><b>${ev.hardSum}</b></div>${["S0 미배정", "S1 이동 횟수 분산", "S2 이동 거리 분산", "S3 휴일 가중치 분산", "S4 리그 총 이동거리"].map((n, k) => `<div class="kv"><span>${n}</span><span class="num">${fmt(-ev.soft["S" + k])}</span></div>`).join("")}`;
      case "fixteam": {
        const t = c.data.t, vs = ev.hard.filter((v) => v.team === t);
        return `<div>${chip(t)} 관련 위반 ${vs.length}건 · 최장 연속 원정 ${ev.per[t].maxA} · 이동 ${fmt(ev.per[t].km)}km</div>${vs.map((v) => `<div class="vrow"><span class="rule">${v.rule}</span><div>${esc(v.detail)}<div class="fixes">${fixBtns(v)}</div></div></div>`).join("") || '<p class="faint">이 구단에는 지금 Hard 위반이 없습니다.</p>'}`;
      }
      case "delta": {
        const b = c.data.before;
        return `<div style="display:flex;gap:22px"><div><div class="big">${ev.hardSum}</div><div class="faint">Hard (${sign(ev.hardSum - b.hardSum)})</div></div><div><div class="big">${fmt(ev.soft.S4)}</div><div class="faint">리그 km (${sign(ev.soft.S4 - b.soft.S4)})</div></div></div>
          ${big ? `<table class="mini" style="margin-top:10px"><tr><th>구단</th><th>이동거리</th><th>Δ</th></tr>${T.map((t) => { const d = ev.per[t].km - b.per[t].km; return `<tr><td>${chip(t)}</td><td class="num">${fmt(ev.per[t].km)}</td><td class="num ${d > 0 ? "up" : d < 0 ? "down" : "faint"}">${sign(d)}</td></tr>`; }).join("")}</table>` : ""}`;
      }
      case "rain": return `<div class="big">☂ 1경기</div><div>${chip(c.data.away)}@${chip(c.data.home)} · ${c.data.d.slice(5)} · ${park(c.data.home)}</div><div class="faint">재편성 대기 ${cancelled.length}경기</div>`;
      case "rebook": { const r = c.data.r; return `<div style="display:flex;gap:22px"><div><div class="big">${r.placed.length}</div><div class="faint">배치</div></div><div><div class="big">${r.unplaced.length}</div><div class="faint">미배치</div></div><div><div class="big">${r.last ? r.last.slice(5) : "-"}</div><div class="faint">마지막 경기</div></div></div>${big ? `<table class="mini" style="margin-top:8px"><tr><th>날짜</th><th>경기</th><th>구장</th></tr>${r.placed.map((g) => `<tr><td class="num">${g.date.slice(5)}</td><td>${chip(g.away)}@${chip(g.home)}${g.dh ? ' <span class="tag">DH</span>' : ""}</td><td>${park(g.home)}</td></tr>`).join("")}</table><p class="faint" style="font-size:11px">월요일 ${c.data.opt.monday ? "허용" : "금지"} · DH ${c.data.opt.dh ? "허용" : "금지"} · RH-1/RH-2만 지키는 목업 배치</p>` : ""}`; }
      case "km": {
        const w = big ? 520 : 240, bh = big ? 30 : 13, mx = 9000;
        return `<svg width="${w}" height="${T.length * bh + 6}">${T.slice().sort((a, b) => ev.per[b].km - ev.per[a].km).map((t, k) => { const v = ev.per[t].km, over = Math.abs(v - ev.avg.km) > 300; return `<text x="0" y="${k * bh + bh * 0.72}" font-size="${big ? 12 : 9}">${t}</text><rect x="44" y="${k * bh + 2}" width="${(v / mx) * (w - 110)}" height="${bh - 4}" rx="2" fill="${color(t)}"/><text x="${50 + (v / mx) * (w - 110)}" y="${k * bh + bh * 0.72}" font-size="${big ? 11 : 9}" fill="${over ? "#c9302c" : "#666"}">${fmt(v)}${over ? "▲" : ""}</text>`; }).join("")}<line x1="${44 + (ev.avg.km / mx) * (w - 110)}" x2="${44 + (ev.avg.km / mx) * (w - 110)}" y1="0" y2="${T.length * bh}" stroke="#2f5bea" stroke-dasharray="3 3"/></svg>${big ? `<p class="faint" style="font-size:11px">점선은 리그 평균 ${fmt(ev.avg.km)}km, ▲는 ±300km 허용오차 초과</p>` : ""}`;
      }
      case "ha": return T.slice(0, big ? 10 : 4).map((t) => { let run = 0, prev = null; return `<div style="display:flex;gap:8px;align-items:center;margin:${big ? 6 : 3}px 0"><span style="width:40px">${chip(t)}</span><div class="strip">${KB.teamSeq(store.plan, t).slice(0, big ? 45 : 22).map((s) => { const k = s.home === t ? "H" : "A"; run = k === prev ? run + 1 : 1; prev = k; return `<span class="${k}${run > 3 ? " over" : ""}"></span>`; }).join("")}</div></div>`; }).join("");
      case "map": case "team": {
        const t = c.data.t, w = big ? 300 : 150, h = big ? 380 : 170, P = KB.projector(w, h, 10);
        const seq = KB.teamSeq(store.plan, t);
        let path = "";
        for (let k = 1; k < seq.length; k++) { const a = KB.teamXY(P, seq[k - 1].home), b = KB.teamXY(P, seq[k].home); if (a[0] !== b[0] || a[1] !== b[1]) path += `<path d="${KB.arc(a, b, 0.15)}" fill="none" stroke="${color(t)}" stroke-width="1.4" opacity="0.4"/>`; }
        const [hx, hy] = KB.teamXY(P, t);
        let run = 0, prev = null;
        const strip = seq.map((s) => { const k = s.home === t ? "H" : "A"; run = k === prev ? run + 1 : 1; prev = k; return `<span class="${k}${run > 3 ? " over" : ""}" title="${K.slots[s.slot].label}"></span>`; }).join("");
        return `<div style="display:flex;gap:14px"><svg width="${w}" height="${h}">${KB.mapBase(P, { labels: big })}${path}<circle cx="${hx}" cy="${hy}" r="6" fill="${color(t)}" stroke="#fff" stroke-width="2"/></svg>
          <div style="flex:1;min-width:0"><div class="big">${fmt(ev.per[t].km)}<span style="font-size:13px">km</span></div><div class="faint">리그 평균 대비 ${sign(ev.per[t].km - ev.avg.km, "km")}</div>
          <div class="kv"><span>이동 횟수</span><span>${ev.per[t].moves}</span></div><div class="kv"><span>주말 홈 <span class="tag">참고</span></span><span>${ev.per[t].wkHome}</span></div><div class="kv"><span>최장 연속 원정</span><span>${ev.per[t].maxA}</span></div>
          ${big ? `<div style="margin-top:10px" class="faint">시즌 홈(파랑)/원정 흐름</div><div class="strip" style="flex-wrap:wrap;gap:2px;margin-top:4px">${strip}</div>` : ""}</div></div>`;
      }
    }
    return "";
  }
  const LIVE = new Set(["viol", "score", "km", "ha", "map", "team", "fixteam", "run"]);

  function render() {
    const vis = cards.filter((c) => !phase || c.ph === phase);
    const focus = vis.find((c) => c.id === focusId) || vis[0];
    const rest = vis.filter((c) => c !== focus).slice(0, 4);
    const head = (c, big) => `<div class="hd"><span class="ph ph${c.ph}">${c.ph ? PH[c.ph] : "안내"}</span><h3>${esc(c.title)}</h3>${big ? `<span class="q">› ${esc(c.q)}</span>` : ""}<button class="x" data-close="${c.id}" title="카드 닫기">✕</button></div>`;
    let h = focus ? `<section class="card focus" data-id="${focus.id}">${head(focus, true)}<div class="bd">${body(focus, true)}</div>${LIVE.has(focus.kind) ? '<div class="ft"><span class="tag">실시간 · 수정하면 다시 계산</span></div>' : ""}</section>` : "";
    h += rest.map((c) => `<section class="card small" data-id="${c.id}">${head(c, false)}<div class="bd">${body(c, false)}</div></section>`).join("");
    for (let k = rest.length; k < 4; k++) h += `<div class="empty">명령을 입력하면 카드가 여기에 놓입니다</div>`;
    $("#board").innerHTML = h;
    const ev = store.ev;
    $("#badge").innerHTML = KB.badge(ev);
    $("#sc").textContent = `리그 ${fmt(ev.soft.S4)}km · 고정 ${store.plan.filter((s) => s.pin).length} · 우천 ${cancelled.length}`;
    [1, 2, 3, 4].forEach((p) => { $("#n" + p).textContent = cards.filter((c) => c.ph === p).length; });
    $("#n2").className = "n" + (ev.hardSum ? " bad" : "");
    $("#n2").textContent = ev.hard.length ? `⚠${ev.hard.length}` : cards.filter((c) => c.ph === 2).length;
    renderSugg();
  }
  function renderSugg() {
    const ev = store.ev, s = [];
    if (ev.hard.length) { s.push("위반"); const t = ev.hard.find((v) => v.team); if (t) s.push(`${t.team} 연속 원정 고쳐줘`); }
    s.push("실행", "이동거리", "KIA 일정", "우천 6/10 KIA 삼성");
    if (cancelled.length) s.push("재편성 월요일");
    s.push("시즌 3/22~8/31 휴식 월", "지도 롯데", "되돌리기");
    $("#sugg").innerHTML = `<span class="lead">다음 할 일 ›</span>${s.map((x) => `<button data-run="${esc(x)}">${esc(x)}</button>`).join("")}`;
  }
  function renderHist() {
    $("#hist").innerHTML = `<span class="lead">명령 기록</span>${history.slice(0, 12).map((h) => `<button data-fill="${esc(h)}" title="명령 줄에 다시 넣기">${esc(h)}</button>`).join("")}<span style="flex:1"></span><button data-run="되돌리기">↶ 되돌리기</button>`;
  }
  function setPhase(p) {
    phase = p;
    $$(".rail [data-ph]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.ph === p)));
    render();
  }

  // ── 자동 완성 팔레트 ──
  const q = $("#q"), ac = $("#ac");
  let acSel = 0, acItems = [];
  function openAC() {
    const v = q.value.trim();
    acItems = COMMANDS.filter((m) => !v || m.t.includes(v.split(" ")[0]) || m.ex.includes(v) || m.d.includes(v) || PH[m.ph].includes(v));
    if (!acItems.length) acItems = COMMANDS;
    acSel = Math.min(acSel, acItems.length - 1);
    ac.innerHTML = acItems.map((m, k) => `<div class="it" role="option" data-k="${k}" aria-selected="${k === acSel}"><span class="ph ph${m.ph}">${PH[m.ph]}</span><code>${esc(m.t).replace(/&lt;([^&]+)&gt;/g, "<i>‹$1›</i>")}</code><span class="d">${m.d}</span><code class="faint">${esc(m.ex)}</code></div>`).join("");
    ac.classList.add("show");
  }
  const closeAC = () => ac.classList.remove("show");
  q.addEventListener("input", () => { $("#pv").innerHTML = dry(parse(q.value)); if (ac.classList.contains("show")) openAC(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { if (!ac.classList.contains("show")) openAC(); acSel = (acSel + (e.key === "ArrowDown" ? 1 : -1) + acItems.length) % acItems.length; openAC(); e.preventDefault(); }
    else if (e.key === "Tab" && ac.classList.contains("show")) { e.preventDefault(); q.value = acItems[acSel].ex; closeAC(); $("#pv").innerHTML = dry(parse(q.value)); }
    else if (e.key === "Enter") {
      if (e.isComposing) return;
      if (ac.classList.contains("show") && !q.value.trim()) { q.value = acItems[acSel].ex; }
      closeAC(); exec(q.value); q.value = ""; $("#pv").innerHTML = "";
    } else if (e.key === "Escape") closeAC();
  });
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); q.focus(); openAC(); }
    if ((e.metaKey || e.ctrlKey) && e.key === "z" && document.activeElement !== q) { e.preventDefault(); store.undo(); }
  });
  ac.addEventListener("mousedown", (e) => { const it = e.target.closest("[data-k]"); if (it) { e.preventDefault(); q.value = acItems[+it.dataset.k].ex; closeAC(); $("#pv").innerHTML = dry(parse(q.value)); q.focus(); } });
  q.addEventListener("blur", () => setTimeout(closeAC, 120));
  document.addEventListener("click", (e) => {
    const run = e.target.closest("[data-run]");
    if (run) { e.preventDefault(); exec(run.dataset.run); return; }
    const fill = e.target.closest("[data-fill]");
    if (fill) { q.value = fill.dataset.fill; q.focus(); $("#pv").innerHTML = dry(parse(q.value)); return; }
    const x = e.target.closest("[data-close]");
    if (x) { cards = cards.filter((c) => c.id !== +x.dataset.close); render(); return; }
    const sm = e.target.closest(".card.small");
    if (sm) { focusId = +sm.dataset.id; render(); return; }
    const ph = e.target.closest(".rail [data-ph]");
    if (ph) setPhase(+ph.dataset.ph);
  });
  // 실시간 카드는 편성이 바뀌거나 솔버가 진행될 때마다 다시 그린다.
  store.on(() => render());

  // 첫 화면: 지난 세션에서 이어 온 것처럼 카드 몇 장을 깔아 둔다.
  add("help", 0, "시작하기", "도움말");
  ["시즌 3/22~8/31 휴식 월", "구단", "이동거리", "위반"].forEach((c) => exec(c));
  renderHist();
  KB.hud("02 편성 커맨드");
  window.CMD = { exec };
})();
</script>
