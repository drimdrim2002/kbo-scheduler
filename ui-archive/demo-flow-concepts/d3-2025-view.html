<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>3 · 2025 계획 보기 — KBO 실제 일정과 숫자 비교</title><link rel="stylesheet" href="../input-flow-concepts/concept.css"><link rel="stylesheet" href="demo.css"></head><body><div class="body"></div><script src="demo.js"></script><script>

  vc('구단 간 이동 거리 차이', '가장 먼 − 가장 가까운', '1,373', '554', 'km', '▼ 819km 줄어 더 고름', 'win') +
