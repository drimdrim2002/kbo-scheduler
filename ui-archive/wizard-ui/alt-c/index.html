<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBO 일정 편성 · 2025 — 편성 워크북 (alt-c)</title>
<script>
  /* 콘솔 오류를 DOM 표식으로 남긴다 (헤드리스 점검용). 다른 스크립트보다 먼저 둔다. */
  (function () {
    window.__wbErrors = [];
    function mark(msg) {
      window.__wbErrors.push(String(msg));
      try { document.documentElement.setAttribute('data-errors', String(window.__wbErrors.length)); document.documentElement.setAttribute('data-error-first', window.__wbErrors[0].slice(0, 300)); } catch (e) { /* 무시 */ }
    }
    window.addEventListener('error', function (e) { mark((e && e.message) + ' @' + (e && e.filename) + ':' + (e && e.lineno)); });
    window.addEventListener('unhandledrejection', function (e) { mark('promise: ' + (e && e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    var ce = console.error;
    console.error = function () { mark(Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack : String(a); }).join(' ')); return ce.apply(console, arguments); };
    document.documentElement.setAttribute('data-errors', '0');
  })();
</script>
<link rel="stylesheet" href="app/workbook/workbook.css">
</head>
<body>
<div id="wb" class="wb" aria-busy="true">
  <header class="tb" id="tb"></header>
  <nav class="stepper" id="stepper" aria-label="편성 단계"></nav>
  <div class="cmd" id="cmd" role="toolbar" aria-label="명령"></div>
  <div class="fx" id="fx" aria-live="polite"></div>
  <main class="main" id="main">
    <section class="sheetarea" id="sheetarea">
      <div class="gridhost" id="gridhost"></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="시트"></div>
    </section>
    <aside class="pane" id="pane" aria-label="작업 창"></aside>
  </main>
  <footer class="status" id="status"></footer>
</div>
<div id="layer"></div>
<div class="small-screen" role="alert">이 도구는 1440×900 이상 화면에서 씁니다. 창을 넓혀 주세요.</div>

<script src="core/calendar-gen.js"></script>
<script src="core/preset-2025.js"></script>
<script src="core/score.js"></script>
<script src="core/reschedule.js"></script>

<script src="core/store.js"></script>

<script src="app/workbook/wb-import.js"></script>
<script src="app/workbook/wb-step2.js"></script>
<script src="app/workbook/wb-step3.js"></script>
<script src="app/workbook/wb-step4.js"></script>
<script src="app/workbook/wb-ops.js"></script>
<script src="app/workbook/wb-settings.js"></script>
<script src="app/workbook/wb-main.js"></script>
</body>
</html>
