<script>
  // 콘솔 오류 표시(개발용): window.onerror·console.error를 DOM 표식으로 남긴다.
  (function () {
    window.__errors = [];
    function mark(msg) {
      window.__errors.push(String(msg));
      try { document.documentElement.setAttribute('data-errors', String(window.__errors.length)); } catch (e) { /* 무시 */ }
    }
    window.addEventListener('error', function (e) { mark(e.message + ' @' + (e.filename || '') + ':' + (e.lineno || '')); });
    window.addEventListener('unhandledrejection', function (e) { mark('promise: ' + (e.reason && e.reason.message || e.reason)); });
    var ce = console.error.bind(console);
    console.error = function () { mark(Array.prototype.join.call(arguments, ' ')); ce.apply(null, arguments); };
  })();
</script>
</head>
