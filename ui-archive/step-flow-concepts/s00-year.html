<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>00 · 맨 먼저 — 시즌 연도 고르기</title><link rel="stylesheet" href="../input-flow-concepts/concept.css"><link rel="stylesheet" href="flow.css"></head><body><div class="body" style="position:relative"></div><script src="../input-flow-concepts/concept.js"></script><script src="flow.js"></script><script>
// 고를 수 있는 연도: 데이터가 있는 가장 이른 해(2025) ~ 오늘 기준 2년 뒤. 시안은 오늘 = 2026-10-29
const today = new Date(Date.UTC(2026, 9, 29)), last = today.getUTCFullYear() + 2;
Flow.chrome({ at: 0, noYear: true, sum: '시즌 연도를 고르면 시작합니다', hint: '<b>맨 먼저 시즌 연도</b> — 고른 연도는 위쪽에 크게 보이고 모든 단계에 그대로 쓰입니다', next: '이어서: 2027 시즌', nextDis: true });
const card = (y, cls, what, btn) => '<div class="yc ' + cls + '"><div class="y">' + y + '<small>시즌</small></div><div class="what">' + what + '</div>' + btn + '</div>';
const Y = [];
for (let y = 2025; y <= last; y++) Y.push(y);
const info = {
  2025: card(2025, 'has', '<span class="stat ok">✓ 데이터 있음</span><br>2025 실제 일정(기본 제공) · 4단계 모두 완료. 단계를 하나씩 눌러 확인합니다.', '<span class="btn">열기</span>'),
  2026: card(2026, 'new', '<span class="stat todo">데이터 없음</span><br>새로 입력합니다. 구단 정보는 가장 최근(2025) 것을 가져와 「바뀐 정보가 있나요?」만 묻습니다.', '<span class="btn">새로 입력</span>'),
  2027: card(2027, 'cont', '<span class="stat blue">이 브라우저에 저장됨</span><br>3단계 「공휴일·홈 구장」에서 멈춤 · 마지막으로 고친 때 10/27(화) 오후 2:32', '<span class="btn pri">이어서 하기 ›</span>'),
  2028: card(2028, 'new', '<span class="stat todo">데이터 없음</span><br>새로 입력합니다. 구단 정보는 가장 최근(2027) 것을 가져와 「바뀐 정보가 있나요?」를 묻습니다.', '<span class="btn">새로 입력</span>')
};
document.querySelector('.body').outerHTML = '<div class="resume"><div class="rcard" style="width:1000px">' +
  '<div class="kick">① 데이터 준비 · 맨 먼저</div><h2>몇 년 시즌을 편성할까요?</h2>' +
  '<p class="sub">고른 연도는 위쪽 띠에 크게 보이고, 데이터 준비부터 배포까지 모든 단계에 그대로 쓰입니다. 그 해 데이터가 있으면 이어서 하고, 없으면 새로 입력합니다. 오늘(2026-10-29) 기준 2년 뒤(' + last + ')까지 고를 수 있습니다.</p>' +
  '<div class="years">' + Y.map((y) => info[y]).join('') + '</div>' +
  '<div class="rfoot"><span>데이터는 이 컴퓨터의 브라우저에 연도별로 저장됩니다. 다른 컴퓨터에서 이어서 하려면 엑셀 서식으로 내려받아 올립니다.</span></div>' +
  '</div></div>';
</script></body></html>
