<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>표준 9 · 2027 ③ 결과 분석 — 목적식마다 탭</title><link rel="stylesheet" href="../input-flow-concepts/concept.css"><link rel="stylesheet" href="../step-flow-concepts/flow.css"><link rel="stylesheet" href="../demo-flow-concepts/demo.css"><link rel="stylesheet" href="plan.css"></head><body><div class="page"></div><script src="plan.js"></script><script>
const P = Plan, G = P.GOALS, S = 'v27a', g = G[1];
P.chrome({ year: 2027, mode: '새 계획', stage: 3, ssub: { 1: '✓ 4단계 검토함 · 추정 5개 확인', 2: '✓ 실행 끝 · 3분', 3: '목적식별 분석 · 아직 저장 안 함', 4: '저장한 버전 없음' },
  prev: '엔진 옵션 바꿔 다시 실행', hint: '<b>결과 분석</b> — 목적식을 눌러 구단별로 봅니다', next: '실행 결과 비교' });
const tile = (x, k) => { const v = P.val(S, x), ok = !x.tol || v <= x.tol; return '<div class="tile' + (x === g ? ' on' : '') + '"><span class="rk">' + (k + 1) + '순위</span><div class="k">' + x.name + '</div><div class="v">' + P.show(S, x) + '<small>' + x.unit + '</small></div>' +
  (x.tol ? '<div class="meter"><i style="width:' + Math.min(100, v / x.tol * 100).toFixed(0) + '%"></i></div><div class="s">허용 ' + P.fmt(x.tol) + x.unit + ' — <b style="color:var(--ok)">' + (ok ? '안' : '넘음') + '</b></div>' : '<div class="s" style="margin-top:6px">짧을수록 좋음 · 10구단 합</div>') + '</div>'; };
const km = P.vals(S, 0), mean = km.reduce((s, v) => s + v, 0) / 10, mn = Math.min(...km);
document.querySelector('.page').innerHTML =
  '<div class="sec" style="padding:10px 14px"><div class="save"><span class="tag ok">✓ 반드시 지킬 규칙 모두 지킴</span><span class="small muted">이 결과에 이름을 붙여 저장:</span><span class="nm">2027 기본안</span><span class="btn pri">버전으로 저장</span><span class="btn">일정 자세히 보기</span><span class="btn">구단별 공정성</span></div></div>' +
  '<div class="tiles">' + G.map(tile).join('') + '</div>' +
  '<div class="tabs">' + G.map((x) => '<span' + (x === g ? ' class="on"' : '') + '>' + x.name + '</span>').join('') + '<span>주말 홈 시리즈</span><span>연속 원정</span></div>' +
  '<div class="grid" style="grid-template-columns:1fr 1.15fr;flex:1">' +
  '<div class="panel"><h3>이동 거리 균형 — 구단별 표 <span class="muted">많은 순</span></h3><table class="cmp"><thead><tr><th>구단</th><th>이동 거리</th><th>평균과 차이</th><th>가장 적은 구단과 차이</th><th>이동 횟수</th></tr></thead><tbody>' +
  P.TEAMS.map((t) => [t, P.D[S][t]]).sort((a, b) => b[1][0] - a[1][0]).map(([t, r]) => '<tr><td><b>' + t + '</b></td><td>' + P.fmt(r[0], 1) + 'km</td><td>' + (r[0] - mean >= 0 ? '+' : '−') + P.fmt(Math.abs(r[0] - mean)) + '</td><td>' + P.fmt(r[0] - mn, 1) + '</td><td>' + r[1] + '</td></tr>').join('') +
  '<tr><td class="muted">평균</td><td>' + P.fmt(mean, 1) + 'km</td><td></td><td class="good">최대 ' + P.show(S, g) + 'km</td><td></td></tr></tbody></table></div>' +
  '<div class="panel"><h3>그래프 <span class="muted">초록 띠 = 가장 적은 구단(SSG) + 허용 차이 600km · 막대는 4,900km부터</span></h3>' + P.teamBars(S, 0, 600, 'km') +
  '<div class="small" style="margin-top:10px;padding:8px 10px;border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:6px">가장 많은 구단 <b>NC 6,010.5km</b> · 가장 적은 구단 <b>SSG 5,453.4km</b> → 차이 <b>557.1km</b>, 허용 600km 안입니다(여유 42.9km).</div></div></div>';
</script></body></html>
