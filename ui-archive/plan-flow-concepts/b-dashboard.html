<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>대안 B · 결과 분석 — 목적식 4개를 한 장 대시보드로</title><link rel="stylesheet" href="../input-flow-concepts/concept.css"><link rel="stylesheet" href="../step-flow-concepts/flow.css"><link rel="stylesheet" href="../demo-flow-concepts/demo.css"><link rel="stylesheet" href="plan.css"></head><body><div class="page" style="gap:10px"></div><script src="plan.js"></script><script>
const P = Plan, G = P.GOALS, S = 'v27a';
P.chrome({ year: 2027, mode: '새 계획', stage: 3, ssub: { 1: '✓ 4단계 검토함 · 추정 5개 확인', 2: '✓ 실행 끝 · 3분', 3: '한 장으로 보기 · 아직 저장 안 함', 4: '저장한 버전 없음' },
  prev: '엔진 옵션 바꿔 다시 실행', hint: '<b>결과 분석</b> — 목적식 4개와 구단별 표를 한 장에 봅니다', next: '실행 결과 비교' });
const pan = (g, k, body) => { const v = P.val(S, g), ok = !g.tol || v <= g.tol;
  return '<div class="panel"><h3><span class="rk">' + (k + 1) + '순위</span>' + g.name + '<span class="r">' + (g.tol ? '차이 <b style="color:var(--navy);font-size:15px">' + P.show(S, g) + g.unit + '</b> / 허용 ' + P.fmt(g.tol) + g.unit + ' <span class="tag ' + (ok ? 'ok' : 'over') + '">' + (ok ? '안' : '넘음') + '</span>' : '<b style="color:var(--navy);font-size:15px">' + P.show(S, g) + g.unit + '</b> 10구단 합') + '</span></h3>' + body + '</div>'; };
const tot = [['2025 KBO 실제', P.TOTAL.kbo25, 'k'], ['2025 이 엔진', P.TOTAL.ours25, ''], ['2027 이 결과', P.TOTAL.v27a, '']];
const big3 = '<div class="big3">' + tot.map(([l, v, c]) => '<div class="b ' + c + '"><span>' + l + '</span><span class="tr"><i style="width:' + (v / 80000 * 100).toFixed(1) + '%"></i></span><span class="n">' + P.fmt(v) + 'km</span></div>').join('') + '</div><div class="xs muted" style="margin-top:8px">참고로 2025 숫자를 함께 둡니다(해가 달라 일정은 다름).</div>' +
  '<div class="small" style="margin-top:12px;padding:8px 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px">4순위라 1~3순위(균형)를 해치지 않는 범위에서 줄입니다. 구단별 거리는 2순위 칸에 있습니다.</div>';
// 구단×지표 표: 평균보다 높으면 주황, 낮으면 파랑(차이가 클수록 진하게)
const cols = [['이동 거리', 0, 1], ['이동 횟수', 1, 0], ['주말·공휴일 점수', 2, 0], ['주말 홈 시리즈', 3, 0], ['가장 긴 연속 원정', 4, 0]];
const heat = (i, v) => { const a = P.vals(S, i), mean = a.reduce((s, x) => s + x, 0) / a.length, span = (Math.max(...a) - Math.min(...a)) || 1, z = (v - mean) / span; return z > 0 ? 'rgba(232,140,40,' + (z * 0.9).toFixed(2) + ')' : 'rgba(31,95,214,' + (-z * 0.6).toFixed(2) + ')'; };
const table = '<table class="heat2"><thead><tr><th>구단</th>' + cols.map((c) => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>' +
  P.TEAMS.map((t) => '<tr><td>' + t + '</td>' + cols.map(([, i, d]) => '<td style="background:' + heat(i, P.D[S][t][i]) + '">' + P.fmt(P.D[S][t][i], d) + '</td>').join('') + '</tr>').join('') +
  '</tbody><tfoot><tr><td>차이</td>' + cols.map(([, i, d]) => '<td><b>' + P.fmt(P.gap(S, i), d) + '</b></td>').join('') + '</tr></tfoot></table>' +
  '<div class="leg" style="margin-top:8px"><span><i style="background:rgba(232,140,40,.8)"></i>평균보다 많음</span><span><i style="background:rgba(31,95,214,.5)"></i>평균보다 적음</span></div>' +
  '<div class="small" style="margin-top:10px;padding:8px 10px;border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:6px">✓ 반드시 지킬 규칙 모두 지킴 · 균형 3가지 모두 허용 차이 안</div>';
document.querySelector('.page').innerHTML =
  '<div class="sec" style="padding:8px 14px"><div class="save"><span class="small muted">이 결과에 이름을 붙여 저장:</span><span class="nm">2027 기본안</span><span class="btn pri">버전으로 저장</span><span class="btn">일정 자세히 보기</span></div></div>' +
  '<div class="dash">' +
  pan(G[0], 0, P.teamBars(S, 1, G[0].tol, '회')) + pan(G[1], 1, P.teamBars(S, 0, G[1].tol, 'km')) +
  '<div class="panel heat"><h3>구단별 한눈에 <span class="muted">색 = 리그 평균과 차이</span></h3>' + table + '</div>' +
  pan(G[2], 2, P.teamBars(S, 2, G[2].tol, '점')) + pan(G[3], 3, big3) + '</div>';
</script></body></html>
