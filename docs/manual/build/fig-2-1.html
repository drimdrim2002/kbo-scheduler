<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 2-1 원본</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #0f1b33; }
  .fig { width: 1120px; padding: 44px 32px 28px; word-break: keep-all; }
  .lanes { display: grid; grid-template-columns: 120px 1fr; row-gap: 26px; }
  .lane-name { display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 700; font-size: 19px; text-align: center; line-height: 1.35; }
  .op .lane-name { background: #fff1e6; color: #b4440a; border: 2px solid #f0a46c; }
  .bot .lane-name { background: #e8f0fe; color: #1d4fbf; border: 2px solid #8fb0ef; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); column-gap: 14px; padding: 0 0 0 14px; }
  .box { border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.45; min-height: 92px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .op .box { background: #fff7f1; border: 1.5px solid #f3c29c; }
  .bot .box { background: #f3f7ff; border: 1.5px solid #b9cdf3; }
  .box b { display: block; font-size: 16.5px; margin-bottom: 3px; }
  .box small { color: #4a5874; font-size: 14px; line-height: 1.5; }
  .empty { visibility: hidden; }
  .num { position: absolute; top: -11px; left: -9px; width: 24px; height: 24px; border-radius: 50%; background: #0f1b33; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .op .lane, .bot .lane { display: contents; }
  .arrows { grid-column: 2; height: 0; position: relative; }
  .note { margin-top: 22px; padding-left: 134px; font-size: 14px; color: #4a5874; line-height: 1.6; }
  .note b { color: #0f1b33; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div class="fig" id="fig">
  <div class="lanes" style="position:relative">
    <div class="op" style="display:contents">
      <div class="lane-name">운영자</div>
      <div class="row">
        <div class="box"><span class="num">1</span><b>편성 조건 확인</b><small>미리 채운 값이 맞는지 답하고, 다르면 고칩니다</small></div>
        <div class="box"><span class="num">2</span><b>운영 방침 정하기</b><small>무엇을 먼저 챙길지(우선순위)와 어디까지 봐줄지(허용 수준)</small></div>
        <div class="box empty"></div>
        <div class="box"><span class="num">4</span><b>비교해 고르기</b><small>남은 결과를 나란히 놓고 「여기서 갈림」을 읽습니다</small></div>
        <div class="box"><span class="num">5</span><b>확정</b><small>해마다 하나. 확정 취소로 되돌립니다</small></div>
      </div>
    </div>
    <div class="bot" style="display:contents">
      <div class="lane-name">자동 편성</div>
      <div class="row">
        <div class="box empty"></div>
        <div class="box empty"></div>
        <div class="box"><span class="num">3</span><b>안 만들기</b><small>반드시 지킬 규칙을 모두 지키는 일정을 만들고, 방침대로 더 나은 일정을 찾아 결과로 남깁니다</small></div>
        <div class="box empty"></div>
        <div class="box empty"></div>
      </div>
    </div>
    <svg id="arr"></svg>
  </div>
  <div class="note"><b>방침을 바꿔 ②→③을 여러 번</b> 돌리면 결과가 쌓이고, 그 가운데 어느 것을 시즌 일정으로 쓸지는 운영자가 정합니다.</div>
</div>
<script>
  // 상자 사이 화살표: 1→2, 2→3, 3→4, 4→5, 그리고 4→2(다시 실행) 점선
  const boxes = [...document.querySelectorAll('.box')];
  const op = boxes.slice(0, 5), bot = boxes.slice(5);
  const B = [op[0], op[1], bot[2], op[3], op[4]];
  const svg = document.getElementById('arr');
  const host = svg.parentElement.getBoundingClientRect();
  svg.setAttribute('width', host.width); svg.setAttribute('height', host.height);
  const R = e => { const r = e.getBoundingClientRect(); return { l: r.left - host.left, r: r.right - host.left, t: r.top - host.top, b: r.bottom - host.top, cx: (r.left + r.right) / 2 - host.left, cy: (r.top + r.bottom) / 2 - host.top }; };
  let s = '<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5874"/></marker></defs>';
  const line = (d, dash) => s += `<path d="${d}" fill="none" stroke="#4a5874" stroke-width="2" ${dash ? 'stroke-dasharray="6 5"' : ''} marker-end="url(#h)"/>`;
  const a = R(B[0]), b = R(B[1]), c = R(B[2]), d = R(B[3]), e = R(B[4]);
  line(`M${a.r + 2},${a.cy} L${b.l - 3},${b.cy}`);
  line(`M${b.cx},${b.b + 2} L${b.cx},${c.cy} L${c.l - 3},${c.cy}`);
  line(`M${c.r + 2},${c.cy} L${d.cx},${c.cy} L${d.cx},${d.b + 3}`);
  line(`M${d.r + 2},${d.cy} L${e.l - 3},${e.cy}`);
  line(`M${d.cx - 30},${d.t - 2} L${d.cx - 30},${d.t - 22} L${b.cx},${d.t - 22} L${b.cx},${b.t - 3}`, true);
  svg.innerHTML = s;
</script>
</body>
</html>
